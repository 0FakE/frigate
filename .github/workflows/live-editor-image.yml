name: Modern Camera UI Preview Image

on:
  push:
    branches:
      - feature/modern-camera-ui
      - feature/zone-objects-ui-build
    paths:
      - 'docker/live-editor/**'
      - 'web/**'
      - 'frigate/config.py'
      - 'frigate/test/test_disabled_camera_resolution.py'
      - 'docker/live-editor/Dockerfile'
      - 'frigate/http.py'
      - 'frigate/util/live_polygon_editor.py'
      - 'frigate/util/editor_locale.py'
      - '.github/workflows/live-editor-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: modern-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish isolated Modern Camera UI AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/live-editor/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ github.ref_name == 'feature/zone-objects-ui-build' && 'ghcr.io/0fake/frigate:0.13.2-zone-objects-ui-dev' || 'ghcr.io/0fake/frigate:0.13.2-modern-camera-ui-dev' }}
          cache-from: type=gha,scope=modern-camera-ui
          cache-to: type=gha,mode=max,scope=live-editor-zone-objects
